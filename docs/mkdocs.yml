site_name: go-oci-blob
site_description: Go library for uploading and downloading OCI blobs
site_url: https://imgoci.github.io/go-oci-blob/
repo_name: imgoci/go-oci-blob
repo_url: https://github.com/imgoci/go-oci-blob
edit_uri: edit/master/docs/docs/
docs_dir: docs
site_dir: build
strict: true

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - content.tooltips
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Tutorials:
      - Push and pull your first blob: tutorials/getting-started.md
  - How-to guides:
      - Authenticate to a registry: how-to/authenticate.md
      - Enable chunked upload and parallel pull: how-to/tune-transfers.md
      - Refresh registry compatibility: how-to/refresh-registry-compatibility.md
  - Reference:
      - Embedding API: reference/embedding.md
      - Registry compatibility: reference/registry-compatibility.md
  - Explanation:
      - Design: explanation/design.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/palette.css
