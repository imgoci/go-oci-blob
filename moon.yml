language: 'go'
layer: 'library'
stack: 'backend'

project:
  title: 'go-oci-blob'
  description: 'Go library for uploading and downloading OCI blobs.'
  owner: 'imgoci'
  maintainers:
    - 'imgoci'

# Every task runs against `system` binaries that mise (mise.toml + mise.lock) puts
# on PATH; moon manages no language toolchain itself.
toolchains:
  default: 'system'

fileGroups:
  goSources:
    - '**/*.go'
    # test/ is a separate Go module with its own maintenance tasks.
    - '!test/**/*.go'
    - 'go.mod'
    - 'go.sum'
    # Tool/version pins. Under the `system` toolchain moon does not hash the Go
    # binary's version, so the mise pins are inputs here too — bumping Go (or any
    # tool) in mise must invalidate the cacheable build task.
    - 'mise.toml'
    - 'mise.lock'
  lintConfig:
    - '.golangci.yml'
    - 'mise.toml'
    - 'mise.lock'
  releaseConfig:
    - 'release-please-config.json'
    - '.release-please-manifest.json'

workspace:
  inheritedTasks:
    include: []

tasks:
  format:
    command: 'golangci-lint fmt --config .golangci.yml --diff'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  lint:
    command: 'golangci-lint run --allow-serial-runners --config .golangci.yml ./... --show-stats=false'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  build:
    command: 'go build ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  test:
    command: 'go test ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  # Integration tests are build-tagged out of the plain test task; they
  # need a running Docker daemon for testcontainers.
  test-e2e:
    command: 'go test -tags e2e ./internal/integration/...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  check:
    deps:
      - 'root:format'
      - 'root:lint'
      - 'root:build'
      - 'root:test'
      - 'root:test-e2e'
      # Static and local-only harness maintenance; never contacts a hosted registry.
      - 'compat:check'
      - 'docs:build'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
      - '@group(releaseConfig)'
    options:
      cache: false
      runInCI: true
